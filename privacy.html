<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tabcat · Privacy</title>
  <meta name="description" content="What tabcat keeps, where it keeps it, and what leaves your browser.">
  <link rel="icon" href="icons/icon32.png">
  <meta name="theme-color" content="#f4f2ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18171a" media="(prefers-color-scheme: dark)">
  <script>
    // The dashboard's last theme / colour (as its index.html does), and the page hidden until the text is in
    try {
      const look = JSON.parse(localStorage.getItem('tabcat:look') || 'null');
      const root = document.documentElement;
      if (look?.theme && look.theme !== 'auto') root.dataset.theme = look.theme;
      const accent = look?.accent || 'purple', hue = look?.accent ? look.hue : 300;
      if (accent === 'mono') root.dataset.accent = 'mono';
      else if (accent !== 'orange' && hue != null) { root.dataset.accent = accent; root.style.setProperty('--hue', hue); }
    } catch { /* storage unavailable */ }
    document.documentElement.classList.add('booting');
    setTimeout(() => document.documentElement.classList.remove('booting'), 3000);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;1,400&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap">
