[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabcat-server"
version = "1.1.0.dev0"
description = "Your own tabcat server: hosts the tabcat dashboard with accounts, for your own computers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
tabcat-server = "tabcat_server.__main__:main"

[tool.setuptools.packages.find]
include = ["tabcat_server*"]

[tool.setuptools.package-data]
tabcat_server = ["pages/*"]
