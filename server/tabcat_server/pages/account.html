<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tabcat</title>
  <link rel="icon" href="/icons/icon32.png">
  <!-- (the web fonts load without holding the page up: it shows at once, in the system font until they come) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/fonts/pretendard.css">
  <link rel="stylesheet" href="/_server/pages.css">
  <script src="/_server/look.js"></script>
  <script type="module" src="/_server/account.js"></script>
</head>
<body data-checking>
  <div class="wrap">
    <div class="brand"><span class="logo"></span>tabcat</div>
    <div class="card">
      <!-- who: the profile photo (or an initial), changed with the system's open-file dialog -->
      <div class="profile">
        <span class="avatar-wrap">
          <span class="avatar big" id="avatar" aria-hidden="true"></span>
          <button type="button" class="avatar-edit" id="photo-change" data-t-title="photoChange" aria-label="Change photo"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button type="button" class="avatar-edit avatar-remove" id="photo-remove" hidden data-t-title="photoRemove" aria-label="Remove photo"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
        </span>
        <div class="profile-text">
          <!-- the name to go by (or the username): click to change it in place -->
          <h1 class="name-edit" id="name-view" tabindex="0" role="button" data-t-title="nameEdit"></h1>
          <input type="text" class="name-input" id="name-input" maxlength="24" autocomplete="name" spellcheck="false" hidden>
          <p class="muted" id="who"></p>
          <input type="file" id="photo-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        </div>
      </div>
      <div class="row">
        <a class="btn primary" href="/" data-t="openTabcat">Dashboard</a>
        <a class="btn" href="/admin" id="admin-link" hidden data-t="adminPage">Server admin</a>
        <span class="grow"></span>
        <button type="button" class="btn" id="logout" data-t="signOut">Sign out</button>
      </div>
      <hr>
      <form id="pw-form" novalidate>
        <h2 data-t="changePassword">Change password</h2>
        <input type="text" id="pw-user" autocomplete="username" hidden>
        <label><span data-t="currentPassword">Current password</span><input type="password" id="current" autocomplete="current-password"></label>
        <label><span data-t="newPassword">New password</span> <span class="muted small" data-t="pwHint"></span><input type="password" id="new" autocomplete="new-password"></label>
        <label><span data-t="passwordAgain">Password again</span><input type="password" id="again" autocomplete="new-password"></label>
        <p class="msg" id="pw-msg"></p>
        <div class="row end"><button type="submit" class="btn primary" data-t="change">Change</button></div>
      </form>
      <hr>
      <!-- two-step sign-in (optional): the authenticator app's code after the password -->
      <h2 data-t="twofa">Two-step sign-in</h2>
      <div id="twofa"></div>
      <hr>
      <!-- where this account is signed in: each device, from where, since when, last used; sign out of any other -->
      <h2 data-t="devices">Signed-in devices</h2>
      <div class="devices" id="devices"></div>
      <div class="pager" id="pager" hidden><button type="button" class="pager-btn" id="page-prev" aria-label="Previous">‹</button><span id="page-at"></span><button type="button" class="pager-btn" id="page-next" aria-label="Next">›</button></div>
      <div class="row"><button type="button" class="btn" id="others" data-t="signOutOthers">Sign out of other devices</button></div>
      <hr>
      <!-- this account's own security record: the latest -->
      <!-- the pages beside the heading, where they stay as the list grows or shrinks -->
      <div class="ev-bar"><h2 data-t="myEvents">Recent security activity</h2><div class="ev-pager" id="my-ev-pager" hidden><button type="button" class="btn small" id="my-ev-prev" data-t-title="evPrev">‹</button><span class="ev-page"><input type="number" id="my-ev-page" min="1" step="1" inputmode="numeric" data-t-title="evPage"><span class="muted">/</span><span id="my-ev-pages"></span></span><button type="button" class="btn small" id="my-ev-next" data-t-title="evNext">›</button></div></div>
      <div class="events" id="my-events"></div>
      <p class="ev-act small muted" id="ev-act" hidden><span data-t="evNotYou">Not you?</span> <button type="button" class="link-btn" id="ev-pw" data-t="evChangePw">Change your password</button> · <button type="button" class="link-btn" id="ev-others" data-t="signOutOthers">Sign out of other devices</button></p>
      <hr>
      <h2 data-t="deleteAccount">Delete account</h2>
      <p class="muted small" data-t="deleteAccountNote"></p>
      <div class="row" id="delete-row"><button type="button" class="btn danger" id="delete-me" data-t="deleteAccountButton">Delete account…</button><span class="msg" id="delete-msg"></span></div>
      <!-- the only admin: no button, a word why -->
      <p class="only-admin small" id="only-admin" hidden data-t="onlyAdminNoDelete"></p>
    </div>
    <footer class="foot">© 2026 Yu Geunhyeok · <a href="/privacy" target="_blank" rel="noopener" data-t="privacy">Privacy</a> · <a href="https://github.com/nda111/tabcat" target="_blank" rel="noopener">GitHub</a></footer>
  </div>
</body>
</html>
