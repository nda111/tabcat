<!doctype html>
<html lang="en" data-code="{{code}}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tabcat</title>
  <link rel="icon" href="/icons/icon32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap">
  <link rel="stylesheet" href="/fonts/pretendard.css">
  <link rel="stylesheet" href="/_server/pages.css">
  <script src="/_server/look.js"></script>
  <script type="module" src="/_server/error.js"></script>
</head>
<body data-checking data-auto-reveal>
  <div class="wrap">
    <div class="brand"><span class="logo"></span>tabcat</div>
    <div class="card err-card">
      <p class="err-code" id="err-code">{{code}}</p>
      <h1 data-t="err{{key}}T">Something went wrong.</h1>
      <p class="muted" data-t="err{{key}}D"></p>
      <div class="row">
        <a class="btn primary" href="/" data-t="errHome">Go to the dashboard</a>
        <button type="button" class="btn" id="err-back" data-t="errBack">Go back</button>
        <a class="btn" href="" id="err-retry" {{retry}} data-t="errRetry">Try again</a>
      </div>
    </div>
    <footer class="foot">© 2026 Yu Geunhyeok · <a href="/privacy" target="_blank" rel="noopener" data-t="privacy">Privacy</a> · <a href="https://github.com/nda111/tabcat" target="_blank" rel="noopener">GitHub</a></footer>
  </div>
</body>
</html>
