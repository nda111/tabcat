<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tabcat</title>
  <link rel="icon" href="/icons/icon32.png">
  <!-- (the web fonts load without holding the page up: it shows at once, in the system font until they come) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/fonts/pretendard.css">
  <link rel="stylesheet" href="/_server/pages.css">
  <script src="/_server/look.js"></script>
  <script type="module" src="/_server/login.js"></script>
</head>
<body data-checking>
  <div class="wrap">
    <div class="brand"><span class="logo"></span>tabcat</div>
    <form class="card intro" id="form" novalidate>
      <h1 id="title" data-t="signInTitle">Sign in</h1>
      <!-- as many accounts signed in here as there may be: which one to sign out of, first -->
      <div class="choose" id="choose" hidden>
        <p id="choose-text"></p>
        <div class="choose-list" id="choose-list"></div>
      </div>
      <label><span data-t="username">Username</span><span class="field-row"><input type="text" id="username" maxlength="14" autocomplete="username" autocapitalize="off" spellcheck="false" required><button type="button" class="btn check-btn" id="check-name" hidden><span class="lbl" data-t="checkUsername">Check</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></span></label>
      <label id="name-row" hidden><span data-t="displayName">Name</span> <span class="muted small" data-t="optional">(optional)</span><input type="text" id="name" autocomplete="name" maxlength="24" spellcheck="false"></label>
      <label><span data-t="password">Password</span><input type="password" id="password" autocomplete="current-password" required></label>
      <!-- signing in: the username kept for next time; staying signed in (when the server lets one) -->
      <div class="row login-opts" id="login-opts">
        <label class="check"><input type="checkbox" id="remember-id"><span data-t="rememberId">Remember my username</span></label>
        <label class="check" id="keep-row"><input type="checkbox" id="keep" checked><span data-t="staySignedIn">Stay signed in</span></label>
      </div>
      <label id="again-row" hidden><span data-t="passwordAgain">Password again</span><input type="password" id="again" autocomplete="new-password"></label>
      <label id="invite-row" hidden><span data-t="invite">Invitation code</span><input type="text" id="invite" autocomplete="off" spellcheck="false"></label>
      <!-- two-step sign-in: after the password, the authenticator app's code (or a recovery code) -->
      <div id="code-step" hidden>
        <p class="muted" id="code-text" data-t="codeText">Enter the 6-digit code from your authenticator app.</p>
        <label><span id="code-label" data-t="codeLabel">Code</span><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" spellcheck="false"></label>
        <p class="small code-links"><button type="button" class="link-btn" id="use-recovery" data-t="useRecovery">Use a recovery code</button> · <button type="button" class="link-btn" id="code-back" data-t="codeBack">Start again</button></p>
      </div>
      <p class="msg keep" id="msg"></p>
      <div class="row pair"><button type="submit" class="btn primary" id="go" data-t="signIn">Sign in</button><button type="button" class="btn" id="other" hidden></button><button type="button" class="btn" id="back-btn" hidden data-t="goBack">Back</button></div>
      <p class="muted small forgot" id="forgot" data-t="forgotHint">Forgot your password? Ask your server’s admin.</p>
    </form>
    <footer class="foot">© 2026 Yu Geunhyeok · <a href="/privacy" target="_blank" rel="noopener" data-t="privacy">Privacy</a> · <a href="https://github.com/nda111/tabcat" target="_blank" rel="noopener">GitHub</a></footer>
  </div>
</body>
</html>
