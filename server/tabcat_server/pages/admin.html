<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tabcat</title>
  <link rel="icon" href="/icons/icon32.png">
  <!-- (the web fonts load without holding the page up: it shows at once, in the system font until they come) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/fonts/pretendard.css">
  <link rel="stylesheet" href="/_server/pages.css">
  <script src="/_server/look.js"></script>
  <script type="module" src="/_server/admin.js"></script>
</head>
<body data-checking>
  <div class="wrap top">
    <div class="row" style="width:100%;max-width:960px">
      <div class="brand"><span class="logo"></span><span data-t="adminTitle">Server admin</span></div>
      <span class="grow"></span>
      <a class="btn" href="/" data-t="openTabcat">Dashboard</a>
      <a class="btn" href="/account" data-t="accountTitle">Your account</a>
    </div>

    <div class="card wide">
      <section>
        <h2 data-t="users">Users</h2>
        <table><thead><tr><th data-t="username">Username</th><th class="hide-narrow" data-t="lastSeen">Last seen</th><th colspan="5"></th></tr></thead><tbody id="users"></tbody></table>
        <p class="msg" id="users-msg"></p>
        <form id="add-form" class="row" novalidate>
          <input type="text" id="add-name" maxlength="14" data-t-placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:140px;margin:0">
          <input type="text" id="add-display" data-t-placeholder="nameOptional" autocomplete="off" maxlength="12" spellcheck="false" style="flex:1;min-width:120px;margin:0">
          <input type="password" id="add-pw" data-t-placeholder="password" autocomplete="new-password" style="flex:1;min-width:140px;margin:0">
          <label class="check" style="margin:0"><input type="checkbox" id="add-admin"><span data-t="asAdmin">Admin</span></label>
          <button type="submit" class="btn primary" data-t="add">Add</button>
        </form>
        <p class="msg" id="add-msg"></p>
      </section>
    </div>

    <div class="card wide">
      <section>
        <h2 data-t="signup">Sign-up</h2>
        <div class="radios" id="signup">
          <label><input type="radio" name="signup" value="closed"><span><b data-t="signupClosed"></b><br><span class="muted small" data-t="signupClosedText"></span></span></label>
          <label><input type="radio" name="signup" value="invite"><span><b data-t="signupInvite"></b><br><span class="muted small" data-t="signupInviteText"></span></span></label>
          <label><input type="radio" name="signup" value="open"><span><b data-t="signupOpen"></b><br><span class="muted small" data-t="signupOpenText"></span></span></label>
        </div>
        <p class="msg keep" id="settings-msg"></p>
      </section>
      <section>
        <h2 data-t="invites">Invitations</h2>
        <form id="invite-form" class="row" style="align-items:flex-end" novalidate>
          <label style="margin:0;flex:1;min-width:220px"><span class="muted small" data-t="expiresIn"></span><input type="number" id="invite-days" min="1" max="365" value="7"></label>
          <button type="submit" class="btn" data-t="createInvite">Create invitation</button>
        </form>
        <table style="margin-top:8px"><tbody id="invites"></tbody></table>
      </section>
    </div>

    <div class="card wide">
      <section>
        <h2 data-t="security">Security</h2>
        <div class="fields">
          <label><span data-t="sessionDays">Stay signed in for (days)</span><input type="number" id="session-days" min="0" max="365"></label>
          <label><span data-t="loginTries">Wrong passwords before a wait</span><input type="number" id="login-tries" min="3" max="50"></label>
          <label><span data-t="loginLock">The wait (minutes)</span><input type="number" id="login-lock" min="1" max="1440"></label>
          <label><span data-t="logDays">Keep the security record (days)</span><input type="number" id="log-days" min="7" max="365"></label>
        </div>
        <p class="msg keep" id="security-msg"></p>
        <dl id="sessions"></dl>
        <p class="muted small" data-t="startupNote">Set when the server starts:</p>
        <dl id="startup"></dl>
        <div class="row"><button type="button" class="btn danger" id="logout-all" data-t="logoutAll">Sign everyone out…</button></div>
      </section>
    </div>

    <div class="card wide">
      <section>
        <!-- the security record: sign-ins and failures, changes, admins' doings; one account's, or everyone's -->
        <div class="row ev-head"><h2 data-t="eventsTitle">Security record</h2><span class="grow"></span><select id="ev-user" aria-label="Account"></select><button type="button" class="btn small" id="ev-export" data-t="eventsExport">Export</button></div>
        <div id="ev-fails"></div>
        <div class="events" id="events"></div>
        <div class="row end"><button type="button" class="btn small" id="ev-more" hidden data-t="eventsMore">More</button></div>
      </section>
    </div>

    <div class="card wide">
      <section>
        <!-- Tailscale on the server's computer: (i) says what it gives -->
        <h2 class="with-info"><svg class="ts-logo" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="2.6" opacity=".22"/><circle cx="12" cy="4" r="2.6" opacity=".22"/><circle cx="20" cy="4" r="2.6" opacity=".22"/><circle cx="4" cy="12" r="2.6"/><circle cx="12" cy="12" r="2.6"/><circle cx="20" cy="12" r="2.6"/><circle cx="4" cy="20" r="2.6" opacity=".22"/><circle cx="12" cy="20" r="2.6"/><circle cx="20" cy="20" r="2.6" opacity=".22"/></svg>Tailscale <span class="info-dot" tabindex="0" aria-describedby="ts-info"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="info-tip" role="tooltip" id="ts-info"></span></span></h2>
        <div id="tailscale"><p class="muted small" data-t="tsLooking">Looking…</p></div>
      </section>
    </div>

    <div class="card wide">
      <section>
        <h2 data-t="server">Server</h2>
        <dl id="info"></dl>
        <!-- moving the database (on the server's own computer): opens under the list -->
        <div id="db-move" hidden>
          <form id="db-form" class="row" novalidate>
            <input type="text" id="db-path" data-t-placeholder="dbPathHint" spellcheck="false" autocomplete="off" style="flex:1;min-width:220px;margin:0">
            <button type="submit" class="btn primary" data-t="dbMove">Move</button>
            <button type="button" class="btn" id="db-cancel" data-t="cancel">Cancel</button>
          </form>
          <p class="msg" id="db-msg"></p>
        </div>
        <div class="row">
          <button type="button" class="btn" id="update" data-t="updateNow">Update now</button>
          <span class="msg" id="info-msg"></span>
        </div>
      </section>
    </div>
    <footer class="foot">© 2026 Yu Geunhyeok · <a href="/privacy" target="_blank" rel="noopener" data-t="privacy">Privacy</a> · <a href="https://github.com/nda111/tabcat" target="_blank" rel="noopener">GitHub</a></footer>
  </div>
</body>
</html>
