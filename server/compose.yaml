# docker compose up -d: tabcat-server, started again after a crash or a reboot, its data in a volume
services:
  tabcat:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]   # (only this computer: put HTTPS in front for others)
    volumes: [tabcat-data:/data]
    environment:
      # (from inside the container this computer's browser comes from Docker's network: let it set the server up)
      TABCAT_SETUP_FROM: "127.0.0.1/32,::1/128,172.16.0.0/12"
volumes:
  tabcat-data:
